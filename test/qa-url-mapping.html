<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zeffy Widget — URL mapping tests</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
    .row { background: #fff; border-left: 4px solid #ccc; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
    .row.pass { border-left-color: #22c55e; }
    .row.fail { border-left-color: #ef4444; }
    .what { font-weight: 600; }
    .detail { color: #555; font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; margin-top: 4px; }
    #summary { font-weight: 700; font-size: 15px; margin-bottom: 16px; }
    #stage { position: absolute; left: -9999px; top: 0; }
  </style>
</head>
<body>
  <h1>Zeffy Widget — URL mapping tests</h1>
  <p class="sub">Every Zeffy form type a customer can paste, and the embed URL the widget opens for it.</p>
  <div id="summary">Running…</div>
  <div id="results"></div>
  <div id="stage"></div>

  <script type="module">
    import ZeffyDonationWidget from '../src/site/widgets/custom-elements/zeffy-donation-widget/element.js';
    customElements.define('zeffy-donation-widget', ZeffyDonationWidget);

    const stage = document.getElementById('stage');
    const results = document.getElementById('results');
    let pass = 0, fail = 0;

    function record(ok, what, detail) {
      ok ? pass++ : fail++;
      const row = document.createElement('div');
      row.className = 'row ' + (ok ? 'pass' : 'fail');
      row.innerHTML = `<div class="what">${ok ? 'PASS' : 'FAIL'} — ${what}</div><div class="detail">${detail}</div>`;
      results.appendChild(row);
    }

    // Renders the widget for a pasted URL and returns what the modal would load,
    // or null when the widget rejected the URL.
    function embedUrlFor(formUrl) {
      stage.innerHTML = '';
      const el = document.createElement('zeffy-donation-widget');
      el.setAttribute('form-url', formUrl);
      el.setAttribute('button-action', 'modal');   // the modal is what loads the embed URL
      stage.appendChild(el);

      const button = el.shadowRoot.querySelector('button');
      if (!button) return null;              // error or onboarding state
      button.click();
      const iframe = el.shadowRoot.querySelector('iframe');
      return iframe ? iframe.getAttribute('src') : null;
    }

    // Real customer URLs, one per Zeffy form type.
    const accepted = [
      ['event ticketing',        'https://www.zeffy.com/en-US/ticketing/a-key-to-the-arts-kawai-kg-2d-baby-grand-piano-fundraiser', 'https://www.zeffy.com/en-US/embed/ticketing/a-key-to-the-arts-kawai-kg-2d-baby-grand-piano-fundraiser'],
      ['peer-to-peer campaign',  'https://www.zeffy.com/en-CA/peer-to-peer/la-marche-pour-lalzheimer-ig-gestion-de-patrimoine--2026-3', 'https://www.zeffy.com/en-CA/embed/donation-form/la-marche-pour-lalzheimer-ig-gestion-de-patrimoine--2026-3'],
      ['shop',                   'https://www.zeffy.com/en-US/ticketing/apparel-shop-3', 'https://www.zeffy.com/en-US/embed/ticketing/apparel-shop-3'],
      ['membership',             'https://www.zeffy.com/en-US/ticketing/windybush-swim-clubs-bonded-family-memberships', 'https://www.zeffy.com/en-US/embed/ticketing/windybush-swim-clubs-bonded-family-memberships'],
      ['auction',                'https://www.zeffy.com/en-CA/ticketing/lucky-art-ducks-silent-auction', 'https://www.zeffy.com/en-CA/embed/ticketing/lucky-art-ducks-silent-auction'],
      ['donation form (UUID)',   'https://www.zeffy.com/en-US/donation-form/0a769111-381c-4241-aa97-91ea600a744b', 'https://www.zeffy.com/en-US/embed/donation-form/0a769111-381c-4241-aa97-91ea600a744b'],
      ['team fundraiser',        'https://www.zeffy.com/en-CA/team/equipe-kubota-max-gagne', 'https://www.zeffy.com/en-CA/embed/donation-form/equipe-kubota-max-gagne'],
      ['individual fundraiser',  'https://www.zeffy.com/en-CA/fundraising/robert-lepage-3', 'https://www.zeffy.com/en-CA/embed/donation-form/robert-lepage-3'],
      ['no locale prefix',       'https://www.zeffy.com/donation-form/my-form', 'https://www.zeffy.com/embed/donation-form/my-form'],
      ['locale we do not ship yet', 'https://www.zeffy.com/de-DE/ticketing/mein-event', 'https://www.zeffy.com/de-DE/embed/ticketing/mein-event'],
      ['already an embed URL',   'https://www.zeffy.com/en-US/embed/ticketing/free-event', 'https://www.zeffy.com/en-US/embed/ticketing/free-event'],
      ['query string dropped',   'https://www.zeffy.com/en-US/ticketing/free-event?utm_source=wix', 'https://www.zeffy.com/en-US/embed/ticketing/free-event'],
      ['fragment dropped',       'https://www.zeffy.com/en-US/donation-form/my-form#tickets', 'https://www.zeffy.com/en-US/embed/donation-form/my-form'],
    ];

    const rejected = [
      ['another domain',            'https://www.evil.com/donation-form/my-form'],
      ['zeffy.com in a query only', 'https://evil.com/?next=zeffy.com/donation-form/my-form'],
      ['organization page',         'https://www.zeffy.com/en-US/organizations/my-org'],
      ['form type with no form',    'https://www.zeffy.com/en-US/ticketing/'],
      ['not a URL at all',          'my donation form'],
    ];

    for (const [what, input, expected] of accepted) {
      const actual = embedUrlFor(input);
      record(actual === expected, what, `${input}<br>got:      ${actual}<br>expected: ${expected}`);
    }

    for (const [what, input] of rejected) {
      const actual = embedUrlFor(input);
      record(actual === null, `rejected: ${what}`, `${input}<br>got: ${actual === null ? 'error state (correct)' : actual}`);
    }

    stage.innerHTML = '';
    document.getElementById('summary').textContent = `${pass} passed, ${fail} failed`;
    document.title = `${pass} passed, ${fail} failed`;
  </script>
</body>
</html>
